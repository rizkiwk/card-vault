name: card_vault
description: "Offline-first trading card collection manager."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Database (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # Filesystem / paths
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navigation
  go_router: ^14.2.0

  # Images
  image_picker: ^1.1.2
  image: ^4.2.0

  # Charts
  fl_chart: ^0.68.0

  # Backup (export/import)
  archive: ^3.6.1
  share_plus: ^9.0.0
  file_picker: ^8.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

  # Branding generators
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#4254FF"
  adaptive_icon_foreground: "assets/icon/splash_logo.png"

flutter_native_splash:
  color: "#3D5AFE"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#3D5AFE"
    image: "assets/icon/splash_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
